name: Release

on:
  push:
    tags: "v*"

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [lint, test]    
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binaries
        run: |
          make build
          make release-builds

          VERSION="$(./bin/vagrant-registry-export version | head -n 1 | awk '{print $2}' | cut -c1 --complement)"
          printf "VERSION=%s\n" "$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *"-"* ]]; then
            printf "PRERELEASE=1\n" >> "$GITHUB_ENV"
          fi
      - name: Create SHA256SUMS
        run: sha256sum release/* > release/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{github.repository}}
        run: |
          release_tag="v${VERSION}"

          release_args=(--target "$GITHUB_SHA" --title "$release_tag" --generate-notes)
          if [[ -n "$PRERELEASE" ]]; then
            release_args+=(--prerelease --latest=false)
          fi

          gh release create "$release_tag" "${release_args[@]}" release/*

