name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version being released, e.g. v1.0.0
        required: true
      prerelease:
        type: string
        description: Optional prerelease identifier, e.g. rc.1
        required: false
        default: ""
      metadata:
        type: string
        description: Optional build metadata, e.g. build.42
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: [lint, test]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
      metadata: ${{ inputs.metadata }}

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: vagrant-registry-export-*
          path: dist
          merge-multiple: true

      - name: Create SHA256SUMS
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{github.repository}}
          VERSION: ${{ inputs.version }}
          VERSION_PRERELEASE: ${{ inputs.prerelease }}
          VERSION_METADATA: ${{ inputs.metadata }}
        run: |
          release_tag="v${VERSION#v}"
          if [[ -n "$VERSION_PRERELEASE" ]]; then
            release_tag="${release_tag}-${VERSION_PRERELEASE}"
          fi
          if [[ -n "$VERSION_METADATA" ]]; then
            release_tag="${release_tag}+${VERSION_METADATA}"
          fi

          release_args=(--target "$GITHUB_SHA" --title "$release_tag" --generate-notes)
          if [[ -n "$VERSION_PRERELEASE" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$release_tag" dist/* "${release_args[@]}"
